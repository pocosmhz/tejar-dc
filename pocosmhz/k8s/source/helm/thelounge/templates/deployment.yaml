apiVersion: apps/v1
kind: Deployment
metadata:
  name: thelounge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thelounge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thelounge
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/branding: {{ include (print $.Template.BasePath "/branding-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: {{ required "ircServiceIP is required" .Values.ircServiceIP | quote }}
          hostnames:
            - {{ .Values.ircHost | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thelounge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/opt/thelounge
            - name: config
              mountPath: /var/opt/thelounge/config.js
              subPath: config.js
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{- if .Values.branding.enabled }}
{{- range list "logo-vertical-transparent-bg.svg" "logo-vertical-transparent-bg-inverted.svg" "logo-transparent-bg.svg" "logo-transparent-bg-inverted.svg" "logo-horizontal-transparent-bg.svg" "logo-horizontal-transparent-bg-inverted.svg" }}
            - name: branding
              mountPath: /usr/local/share/.config/yarn/global/node_modules/thelounge/public/img/{{ . }}
              subPath: logo.svg
              readOnly: true
{{- end }}
{{- range list "logo-grey-bg.svg" "icon-black-transparent-bg.svg" "favicon-alerted.ico" "logo-grey-bg-120x120px.png" "logo-grey-bg-152x152px.png" "logo-grey-bg-167x167px.png" "logo-grey-bg-180x180px.png" "logo-grey-bg-192x192px.png" "logo-grey-bg-512x512px.png" }}
            - name: branding
              mountPath: /usr/local/share/.config/yarn/global/node_modules/thelounge/public/img/{{ . }}
              subPath: {{ . }}
              readOnly: true
{{- end }}
            - name: branding
              mountPath: /usr/local/share/.config/yarn/global/node_modules/thelounge/public/favicon.ico
              subPath: favicon.ico
              readOnly: true
{{- end }}
{{- if .Values.branding.stylesheet }}
            - name: branding
              mountPath: /usr/local/share/.config/yarn/global/node_modules/thelounge/public/themes/default.css
              subPath: default.css
              readOnly: true
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thelounge-data
        - name: config
          configMap:
            name: thelounge-config
        - name: tmp
          emptyDir: {}
{{- if or .Values.branding.enabled .Values.branding.stylesheet }}
        - name: branding
          configMap:
            name: thelounge-branding
{{- end }}
